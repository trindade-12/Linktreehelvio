<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linktree | Helvio Trindade</title>
    <link rel="stylesheet" href="style.css">
    <!-- Fontes e Ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="container">
        <header class="profile">
            <div class="profile-image-container">
                <img src="https://files.manuscdn.com/user_upload_by_module/session_file/310519663371796709/SCcfUzFuvabmVuZy.jpg" alt="Helvio Trindade" class="profile-image">
            </div>
            <h1 class="profile-name">Helvio Trindade</h1>
            <p class="profile-bio">Estudante de Fisioterapia, Sócio da empresa Colmeia & Sócio da empresa Colmeia Lab 3d.</p>
        </header>

        <section class="links-container">
            <!-- INSTAGRAM -->
            <a href="https://www.instagram.com/helviotrindade/" target="_blank" class="link-card">
                <!-- COLE O LINK DO ICONS8 NO SRC ABAIXO -->
                <img src="https://img.icons8.com/?size=100&id=32292&format=png&color=000000" class="icon-img" alt="Instagram">
                <span>Instagram</span>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>

            <!-- COLMEIA -->
            <a href="https://www.instagram.com/colmeiacreative.co/" target="_blank" class="link-card">
                <!-- COLE O LINK DO ICONS8 NO SRC ABAIXO -->
                <img src="https://img.icons8.com/?size=100&id=95574&format=png&color=000000" class="icon-img" alt="Colmeia">
                <span>Colmeia</span>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>

            <!-- ALPHA 3D -->
            <a href="https://www.instagram.com/colmeia.lab3d/" target="_blank" class="link-card">
                <!-- COLE O LINK DO ICONS8 NO SRC ABAIXO -->
                <img src="https://img.icons8.com/?size=100&id=77121&format=png&color=000000" class="icon-img" alt="Colmeia Lab 3d">
                <span>Colmeia Lab 3d</span>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>

            <!-- WHATSAPP -->
            <a href="https://wa.me/996493116" target="_blank" class="link-card ">
                <!-- COLE O LINK DO ICONS8 NO SRC ABAIXO -->
                <img src="https://img.icons8.com/?size=100&id=vbST8WV7crEk&format=png&color=000000" class="icon-img" alt="WhatsApp">
                <span>WhatsApp</span>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>

            <!-- YOUTUBE -->
            <a href="http://youtube.com/@helviotrindade" target="_blank" class="link-card">
                <!-- COLE O LINK DO ICONS8 NO SRC ABAIXO -->
                <img src="https://img.icons8.com/?size=100&id=37325&format=png&color=000000" class="icon-img" alt="Youtube">
                <span>Youtube</span>
                <i data-lucide="chevron-right" class="chevron"></i>
            </a>
        </section>

        <footer class="social-icons">
            <a href="https://www.instagram.com/helviotrindade/" title="Instagram"><i data-lucide="instagram"></i></a>
            <a href="http://youtube.com/@helviotrindade" title="Youtube"><i data-lucide="youtube"></i></a>
            <a href="mailto:helviotrindade@exemplo.com" title="Email"><i data-lucide="mail"></i></a>
        </footer>
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
